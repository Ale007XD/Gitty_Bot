services:
  gitti-bot:
    # Локальная сборка из Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - BUILDKIT_INLINE_CACHE=1

    image: gitti/gitti-bot:latest
    container_name: gitti-telegram-bot
    restart: unless-stopped

    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_REGION=${GEMINI_REGION:-us-central1}
      - DEBUG=${DEBUG:-false}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}

    volumes:
      # Персистентное хранение данных пользователей
      - ./data/user_data:/app/user_data
      # Логи приложения
      - ./data/logs:/app/logs

    networks:
      - gitti-network

    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.5'

    # Настройки логирования Docker
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Проверка здоровья контейнера
    healthcheck:
      test: ["CMD", "python", "-c", "import os; exit(0 if os.path.exists('/app/user_data') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    # Политики перезапуска
    depends_on: []

networks:
  gitti-network:
    driver: bridge
    name: gitti-network
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes для явного управления данными (опционально)
volumes:
  gitti-user-data:
    name: gitti-user-data
    driver: local

  gitti-logs:
    name: gitti-logs  
    driver: local
