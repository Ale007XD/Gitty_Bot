name: Deploy Gitti Telegram Bot

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gitti-bot

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt

    - name: Run basic syntax check
      run: |
        python -m py_compile app/bot/main.py
        python -c "import app.bot.main; print('✅ Main module imports successfully')"

  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    environment: 
      name: production
      url: https://t.me/your_bot_username

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup SSH key
      uses: webfactory/ssh-agent@v0.8.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: Add VPS to known hosts
      run: |
        ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to VPS
      env:
        VPS_HOST: ${{ secrets.VPS_HOST }}
        VPS_USER: ${{ secrets.VPS_USER }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
      run: |
        ssh ${{ env.VPS_USER }}@${{ env.VPS_HOST }} << 'ENDSSH'
          # Создаем директории
          mkdir -p ~/gitti-bot/{data/user_data,data/logs}
          cd ~/gitti-bot

          # Создаем .env файл
          cat > .env << 'EOL'
        TELEGRAM_BOT_TOKEN=${{ env.TELEGRAM_BOT_TOKEN }}
        GEMINI_API_KEY=${{ env.GEMINI_API_KEY }}
        DEBUG=false
        LOG_LEVEL=INFO
        EOL

          # Загружаем docker-compose.yml если его нет
          if [ ! -f docker-compose.yml ]; then
            curl -sSfL https://raw.githubusercontent.com/${{ github.repository }}/main/docker-compose.yml -o docker-compose.yml
          fi

          # Логинимся в registry
          echo '${{ secrets.GITHUB_TOKEN }}' | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

          # Останавливаем старый контейнер
          docker-compose down 2>/dev/null || true

          # Обновляем образ
          docker pull ${{ env.IMAGE_TAG }} || exit 1

          # Запускаем новый контейнер
          docker-compose up -d

          # Ждем запуска и проверяем статус
          sleep 15
          docker-compose ps
          docker-compose logs --tail=10 gitti-bot
        ENDSSH

    - name: Health Check
      run: |
        sleep 30
        ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
          cd ~/gitti-bot
          if docker-compose ps | grep -q "Up"; then
            echo "✅ Deployment successful!"
            exit 0
          else
            echo "❌ Deployment failed!"
            docker-compose logs --tail=50 gitti-bot
            exit 1
          fi
        ENDSSH

    - name: Notify on success
      if: success()
      run: echo "🎉 Gitti bot successfully deployed to production!"

    - name: Notify on failure
      if: failure()
      run: echo "💥 Deployment failed! Check the logs above."

  cleanup:
    name: Cleanup old images
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
    - name: Clean up old container images
      continue-on-error: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Удаляем старые неиспользуемые образы (оставляем последние 3)
        gh api           --method GET           -H "Accept: application/vnd.github+json"           /user/packages/container/${{ env.IMAGE_NAME }}/versions           --jq '.[3:] | .[] | select(.metadata.container.tags | length == 0) | .id'           | head -10           | xargs -I {} gh api             --method DELETE             -H "Accept: application/vnd.github+json"             /user/packages/container/${{ env.IMAGE_NAME }}/versions/{}           || echo "No old images to cleanup"
