name: Deploy Gitti Bot Direct to VPS (Fixed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt

    - name: Run syntax check
      run: |
        echo "🔍 Проверка синтаксиса Python файлов..."
        python -m py_compile app/bot/main.py
        python -c "import app.bot.main; print('✅ Основной модуль импортируется успешно')"

    - name: Test Docker build
      run: |
        echo "🐳 Тестовая сборка Docker образа..."
        docker build -t gitti-bot-test .
        echo "✅ Docker образ собирается без ошибок"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: []
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    environment:
      name: production
      url: https://t.me/your_bot_username

    steps:
    - name: Deploy to VPS via SSH (No Sudo)
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        timeout: 300s
        script: |
          set -e
          echo "🚀 Начинаем развертывание Gitti Bot..."

          # Проверяем права пользователя
          echo "👤 Текущий пользователь: $(whoami)"
          echo "🐳 Проверка Docker доступа..."
          if ! docker ps &>/dev/null; then
            echo "⚠️  Пользователь не в группе docker, добавляем..."
            sudo usermod -aG docker $USER
            echo "🔄 Перелогинивание в группу docker..."
            newgrp docker <<EONG
              echo "✅ Docker доступ получен"
          EONG
          else
            echo "✅ Docker доступ уже есть"
          fi

          # Создаем рабочую директорию
          mkdir -p ~/gitti-bot
          cd ~/gitti-bot

          # Клонируем или обновляем репозиторий
          if [ ! -d ".git" ]; then
            echo "📥 Клонируем репозиторий..."
            rm -rf * .* 2>/dev/null || true
            git clone https://github.com/${{ github.repository }}.git .
          else
            echo "🔄 Обновляем репозиторий..."
            git fetch origin
            git reset --hard origin/main
            git clean -fd
          fi

          # Создаем .env файл с секретами
          echo "🔐 Создание конфигурации..."
          cat > .env << 'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          DEBUG=false
          LOG_LEVEL=INFO
          EOF

          # Создаем директории для данных БЕЗ SUDO
          echo "📁 Создание директорий для данных..."
          mkdir -p data/{user_data,logs}

          # Устанавливаем права БЕЗ SUDO
          chmod 755 data
          chmod 755 data/user_data  
          chmod 755 data/logs

          # Проверяем владельца директорий
          chown -R $USER:$USER data 2>/dev/null || echo "ℹ️  Права владельца уже корректны"

          # Останавливаем старые контейнеры
          echo "⏹️  Остановка старых контейнеров..."
          docker-compose down --remove-orphans 2>/dev/null || echo "ℹ️  Нет запущенных контейнеров"

          # Удаляем старые образы для освобождения места (без sudo)
          echo "🧹 Очистка старых образов..."
          docker system prune -f --volumes || echo "ℹ️  Очистка пропущена"
          docker image prune -f || echo "ℹ️  Очистка образов пропущена"

          # Собираем новый образ локально
          echo "🔨 Сборка Docker образа..."
          docker-compose build --no-cache --pull

          # Запускаем контейнеры
          echo "▶️  Запуск контейнеров..."
          docker-compose up -d

          # Ждем запуска
          echo "⏳ Ожидание запуска бота..."
          sleep 20

          # Проверяем статус
          echo "📊 Проверка статуса контейнеров..."
          docker-compose ps

          # Показываем логи
          echo "📋 Последние логи:"
          docker-compose logs --tail=10 gitti-bot || echo "ℹ️  Логи пока недоступны"

          echo "✅ Развертывание завершено!"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
    - name: Wait for bot startup
      run: |
        echo "⏳ Ожидание полного запуска бота..."
        sleep 30

    - name: Verify deployment
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        timeout: 60s
        script: |
          cd ~/gitti-bot

          echo "🔍 Проверка работоспособности..."

          # Проверяем статус контейнеров
          if docker-compose ps | grep -q "Up"; then
            echo "✅ Контейнеры запущены"

            # Проверяем логи на наличие ошибок (без sudo)
            if docker-compose logs --tail=20 gitti-bot | grep -i "error\|failed\|exception" > /dev/null; then
              echo "⚠️  Обнаружены ошибки в логах:"
              docker-compose logs --tail=20 gitti-bot | grep -i "error\|failed\|exception"
            else
              echo "✅ В логах нет критических ошибок"
            fi

            # Проверяем использование ресурсов (без sudo)
            echo "📊 Использование ресурсов:"
            docker stats --no-stream gitti-telegram-bot 2>/dev/null || echo "ℹ️  Статистика недоступна"

            echo "🎉 Бот Gitti успешно развернут и работает!"
            exit 0
          else
            echo "❌ Контейнеры не запущены!"
            echo "📋 Статус контейнеров:"
            docker-compose ps
            echo "📋 Логи ошибок:"
            docker-compose logs --tail=30 gitti-bot
            exit 1
          fi

    - name: Notify success
      if: success()
      run: |
        echo "🎸 Gitti Bot успешно развернут!"
        echo "✨ Готов обучать детей игре на гитаре!"

    - name: Notify failure
      if: failure()
      run: |
        echo "💥 Проверка развертывания не прошла!"
        echo "🔍 Проверьте логи VPS и статус контейнеров"

  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    needs: health-check
    if: always()

    steps:
    - name: Cleanup old resources on VPS
      uses: appleboy/ssh-action@v0.1.10
      continue-on-error: true
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          echo "🧹 Очистка ресурсов..."

          # Удаляем неиспользуемые образы (без sudo)
          docker image prune -f --filter "until=24h" || echo "ℹ️  Очистка образов пропущена"

          # Удаляем неиспользуемые тома (без sudo)
          docker volume prune -f || echo "ℹ️  Очистка томов пропущена"

          # Удаляем неиспользуемые сети (без sudo) 
          docker network prune -f || echo "ℹ️  Очистка сетей пропущена"

          # Показываем использование диска (без sudo)
          echo "💾 Использование диска:"
          df -h / || echo "ℹ️  Информация о диске недоступна"

          echo "✅ Очистка завершена"
