name: Deploy Gitti Bot Direct to VPS (Permission-Fixed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r app/requirements.txt

    - name: Run syntax check
      run: |
        echo "🔍 Проверка синтаксиса Python файлов..."
        python -m py_compile app/bot/main.py
        python -c "import app.bot.main; print('✅ Основной модуль импортируется успешно')"

    - name: Test Docker build
      run: |
        echo "🐳 Тестовая сборка Docker образа..."
        docker build -t gitti-bot-test .
        echo "✅ Docker образ собирается без ошибок"

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: []
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    environment:
      name: production
      url: https://t.me/your_bot_username

    steps:
    - name: Deploy to VPS with Permission Handling
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        timeout: 300s
        script: |
          set -e
          echo "🚀 Начинаем развертывание Gitti Bot..."

          # Функция для определения команды Docker Compose
          get_docker_compose_cmd() {
            if command -v docker-compose &> /dev/null; then
              echo "docker-compose"
            elif docker compose version &> /dev/null; then
              echo "docker compose"
            else
              echo ""
            fi
          }

          # Проверяем и устанавливаем Docker Compose
          echo "🐳 Проверка Docker Compose..."
          DOCKER_COMPOSE_CMD=$(get_docker_compose_cmd)

          if [ -z "$DOCKER_COMPOSE_CMD" ]; then
            echo "⚠️  Docker Compose не найден, устанавливаем..."

            # Попробуем установить через apt (без sudo для пользователей группы docker)
            if command -v apt &> /dev/null; then
              apt update 2>/dev/null || echo "ℹ️  Обновление пакетов пропущено"
              apt install -y docker-compose-plugin 2>/dev/null || {
                echo "🔄 Пробуем установить docker-compose через pip..."
                python3 -m pip install --user docker-compose 2>/dev/null || {
                  curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o ~/.local/bin/docker-compose 2>/dev/null || echo "ℹ️  Установка пропущена"
                  chmod +x ~/.local/bin/docker-compose 2>/dev/null || echo "ℹ️  Права не изменены"
                  export PATH="$HOME/.local/bin:$PATH"
                }
              }
            elif command -v yum &> /dev/null; then
              yum install -y docker-compose-plugin 2>/dev/null || {
                echo "🔄 Пробуем установить docker-compose через pip..."
                python3 -m pip install --user docker-compose 2>/dev/null || echo "ℹ️  Установка пропущена"
              }
            else
              echo "🔄 Установка docker-compose через pip..."
              python3 -m pip install --user docker-compose 2>/dev/null || echo "ℹ️  Установка пропущена"
            fi

            # Повторно проверяем
            DOCKER_COMPOSE_CMD=$(get_docker_compose_cmd)

            if [ -z "$DOCKER_COMPOSE_CMD" ]; then
              # Пробуем найти в локальных директориях
              if [ -f ~/.local/bin/docker-compose ]; then
                DOCKER_COMPOSE_CMD="~/.local/bin/docker-compose"
                echo "✅ Найден локальный docker-compose"
              else
                echo "⚠️  Docker Compose недоступен, используем базовую команду"
                DOCKER_COMPOSE_CMD="docker compose"
              fi
            fi
          fi

          echo "✅ Используем команду: $DOCKER_COMPOSE_CMD"

          # Проверяем права пользователя к Docker
          echo "👤 Текущий пользователь: $(whoami)"
          if docker ps &>/dev/null; then
            echo "✅ Docker доступ уже есть"
          else
            echo "⚠️  Недостаточно прав для Docker, попробуем продолжить..."
          fi

          # Создаем рабочую директорию
          mkdir -p ~/gitti-bot
          cd ~/gitti-bot

          # Клонируем или обновляем репозиторий
          if [ ! -d ".git" ]; then
            echo "📥 Клонируем репозиторий..."
            rm -rf * .* 2>/dev/null || true
            git clone https://github.com/${{ github.repository }}.git .
          else
            echo "🔄 Обновляем репозиторий..."
            git fetch origin
            git reset --hard origin/main || echo
            # ИСПРАВЛЕНО: Добавлен || true для игнорирования ошибок прав доступа
            git clean -fd || echo "ℹ️  Очистка файлов пропущена из-за прав доступа"
          fi

          # Создаем .env файл с секретами
          echo "🔐 Создание конфигурации..."
          cat > .env << 'EOF'
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          DEBUG=false
          LOG_LEVEL=INFO
          USER_DATA_PATH=/app/user_data
          LOGS_PATH=/app/logs
          EOF

          # Создаем директории для данных с обработкой ошибок
          echo "📁 Создание директорий для данных..."
          mkdir -p data/{user_data,logs} || echo "ℹ️  Директории уже существуют"
          
          # ИСПРАВЛЕНО: Добавлен || true для игнорирования ошибок прав доступа
          chmod 755 data data/user_data data/logs 2>/dev/null || echo "ℹ️  Изменение прав пропущено"
          chown -R $USER:$USER data 2>/dev/null || echo "ℹ️  Изменение владельца пропущено"

          # Останавливаем старые контейнеры
          echo "⏹️  Остановка старых контейнеров..."
          $DOCKER_COMPOSE_CMD down --remove-orphans 2>/dev/null || echo "ℹ️  Нет запущенных контейнеров"

          # Удаляем старые образы для освобождения места
          echo "🧹 Очистка старых образов..."
          docker system prune -f --volumes 2>/dev/null || echo "ℹ️  Очистка системы пропущена"
          docker image prune -f 2>/dev/null || echo "ℹ️  Очистка образов пропущена"

          # Собираем новый образ локально
          echo "🔨 Сборка Docker образа..."
          $DOCKER_COMPOSE_CMD build --no-cache --pull

          # Запускаем контейнеры
          echo "▶️  Запуск контейнеров..."
          $DOCKER_COMPOSE_CMD up -d

          # Ждем запуска
          echo "⏳ Ожидание запуска бота..."
          sleep 20

          # Проверяем статус
          echo "📊 Проверка статуса контейнеров..."
          $DOCKER_COMPOSE_CMD ps

          # Показываем логи
          echo "📋 Последние логи:"
          $DOCKER_COMPOSE_CMD logs --tail=10 gitti-bot || echo "ℹ️  Логи пока недоступны"

          # Сохраняем команду для дальнейшего использования
          echo "export DOCKER_COMPOSE_CMD='$DOCKER_COMPOSE_CMD'" > ~/.gitti_env

          echo "✅ Развертывание завершено!"

  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: success()

    steps:
    - name: Wait for bot startup
      run: |
        echo "⏳ Ожидание полного запуска бота..."
        sleep 30

    - name: Verify deployment
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: 22
        timeout: 120s
        script: |
          cd ~/gitti-bot

          echo "🔍 Проверка работоспособности..."

          # Загружаем команду Docker Compose
          if [ -f ~/.gitti_env ]; then
            source ~/.gitti_env
          else
            # Определяем команду заново
            if command -v docker-compose &> /dev/null; then
              DOCKER_COMPOSE_CMD="docker-compose"
            elif docker compose version &> /dev/null; then
              DOCKER_COMPOSE_CMD="docker compose"
            else
              DOCKER_COMPOSE_CMD="docker compose"
            fi
          fi

          echo "🐳 Используем команду: $DOCKER_COMPOSE_CMD"

          # Проверяем статус контейнеров
          if $DOCKER_COMPOSE_CMD ps 2>/dev/null | grep -q "Up"; then
            echo "✅ Контейнеры запущены"

            # Проверяем логи на наличие критических ошибок
            echo "🔍 Проверка логов на критические ошибки..."
            if $DOCKER_COMPOSE_CMD logs --tail=30 gitti-bot 2>/dev/null | grep -E "критическая ошибка|critical error|failed to start|permission denied.*critical" > /dev/null; then
              echo "⚠️  Обнаружены критические ошибки в логах:"
              $DOCKER_COMPOSE_CMD logs --tail=20 gitti-bot 2>/dev/null | grep -E "error|failed|exception" | tail -5
            else
              echo "✅ В логах нет критических ошибок"
            fi

            # Проверяем специфические успешные сообщения
            echo "🎸 Проверка успешности запуска бота..."
            if $DOCKER_COMPOSE_CMD logs --tail=50 gitti-bot 2>/dev/null | grep -E "успешно запущен|successfully started|polling" > /dev/null; then
              echo "🎉 Бот успешно запущен и работает!"
            elif $DOCKER_COMPOSE_CMD logs --tail=50 gitti-bot 2>/dev/null | grep -E "Конфигурация загружена|Configuration loaded" > /dev/null; then
              echo "✅ Бот инициализируется корректно"
            else
              echo "⚠️  Статус бота неясен, показываем последние логи:"
              $DOCKER_COMPOSE_CMD logs --tail=10 gitti-bot 2>/dev/null | tail -5 || echo "ℹ️  Логи недоступны"
            fi

            # Показываем последние логи для диагностики
            echo "📋 Последние 5 строк логов:"
            $DOCKER_COMPOSE_CMD logs --tail=5 gitti-bot 2>/dev/null || echo "ℹ️  Логи недоступны"

            echo "🎉 Проверка развертывания завершена успешно!"
            exit 0
          else
            echo "❌ Контейнеры не запущены!"
            echo "📋 Статус контейнеров:"
            $DOCKER_COMPOSE_CMD ps 2>/dev/null || echo "Не удалось получить статус"
            echo "📋 Логи ошибок:"
            $DOCKER_COMPOSE_CMD logs --tail=30 gitti-bot 2>/dev/null || echo "Не удалось получить логи"
            exit 1
          fi

    - name: Notify success
      if: success()
      run: |
        echo "🎸 Gitti Bot успешно развернут!"
        echo "✨ Готов обучать детей игре на гитаре!"
        echo "🚀 Автоматические обновления настроены!"
        echo "🤖 AI-наставник с Google Gemini активен!"

    - name: Notify failure
      if: failure()
      run: |
        echo "💥 Проверка развертывания не прошла!"
        echo "🔍 Проверьте логи VPS и статус контейнеров"
        echo "💡 Возможные причины:"
        echo "   - Проблемы с токенами (TELEGRAM_BOT_TOKEN, GEMINI_API_KEY)"
        echo "   - Недостаточно ресурсов на VPS"
        echo "   - Проблемы с сетевым подключением"

  cleanup:
    name: Cleanup Resources
    runs-on: ubuntu-latest
    needs: health-check
    if: always()

    steps:
    - name: Cleanup old resources on VPS
      uses: appleboy/ssh-action@v0.1.10
      continue-on-error: true
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          echo "🧹 Очистка ресурсов..."

          # Удаляем неиспользуемые образы (старше суток)
          docker image prune -f --filter "until=24h" 2>/dev/null || echo "ℹ️  Очистка образов пропущена"

          # Удаляем неиспользуемые тома
          docker volume prune -f 2>/dev/null || echo "ℹ️  Очистка томов пропущена"

          # Удаляем неиспользуемые сети 
          docker network prune -f 2>/dev/null || echo "ℹ️  Очистка сетей пропущена"

          # Показываем использование диска
          echo "💾 Использование диска:"
          df -h / 2>/dev/null || echo "ℹ️  Информация о диске недоступна"

          # Показываем статистику Docker
          echo "🐳 Docker статистика:"
          docker system df 2>/dev/null || echo "ℹ️  Docker статистика недоступна"

          echo "✅ Очистка завершена"
